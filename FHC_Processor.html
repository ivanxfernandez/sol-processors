<style>
  /* Custom date picker (replaces the native <input type="date"> calendar) */
  .date-field { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:9px 12px; background:var(--field); border:1.5px solid var(--line); border-radius:8px; color:var(--text); font-size:14px; font-family:var(--sans); cursor:pointer; text-align:left; }
  .date-field:hover { border-color:var(--accent-border); }
  .date-field.empty #dateText { color:var(--text-faint); }
  .date-field svg { color:var(--text-faint); flex-shrink:0; }
  .cal-pop { position:absolute; top:100%; left:0; margin-top:6px; z-index:60; width:262px; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 34px rgba(0,0,0,0.22); padding:12px; display:none; }
  .cal-pop.open { display:block; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-title { font-weight:700; color:var(--text); font-size:14px; }
  .cal-navs { display:flex; gap:4px; }
  .cal-nav { width:28px; height:28px; border:none; background:transparent; color:var(--text-soft); border-radius:6px; cursor:pointer; font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .cal-nav:hover { background:var(--accent-weak); color:var(--accent); }
  .cal-dow, .cal-days { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-dow span { text-align:center; font-size:11px; font-weight:600; color:var(--text-faint); padding:4px 0; }
  .cal-day { text-align:center; font-size:13px; padding:7px 0; border-radius:6px; cursor:pointer; color:var(--text); border:none; background:transparent; font-family:var(--sans); }
  .cal-day:hover { background:var(--accent-weak); }
  .cal-day.muted { color:var(--text-faint); }
  .cal-day.today { box-shadow:inset 0 0 0 1.5px var(--accent-border); }
  .cal-day.selected { background:var(--accent); color:var(--accent-contrast); font-weight:700; }
  .cal-day.selected:hover { background:var(--accent-press); }
  .cal-foot { display:flex; justify-content:space-between; margin-top:10px; }
  .cal-link { background:none; border:none; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; padding:4px 6px; border-radius:6px; }
  .cal-link:hover { background:var(--accent-weak); }
</style>

<script>
// Stage 2: Folder drag support
async function getAllFilesFromDrop(items) {
  const files = [];
  async function traverse(entry) {
    if (entry.isFile) {
      await new Promise(res => entry.file(f => { files.push(f); res(); }));
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const entries = await new Promise(res => reader.readEntries(res));
      for (const ent of entries) await traverse(ent);
    }
  }
  for (const item of items) {
    const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
    if (entry) await traverse(entry); else { const f = item.getAsFile(); if (f) files.push(f); }
  }
  return files;
}

if (typeof XLSX === 'undefined') {
  console.error('XLSX failed to load from vendor/xlsx.full.min.js');
}
const OUT_COLS = [
 'Trip ID','Vendor Trip ID','Trip Type','Passenger Member ID','Passenger',
 'Date Of Birth','Phone Number','Mobility','Extra','Estimated Pickup Time',
 'Earliest Departure Time','Latest Arrival Time','Appointment Time',
 'Buffer (minutes)','Pickup Address','Dropoff Address',
 'Estimated Distance (miles)','Third Party','Contract Name',
 'Contract Number','Status','Start Odometer','End Odometer',
 'Start Time','End Time','Comments','VA Notes','Loaded Mileage',
 'Wait Time (Minutes)','Unloaded Mileage','Invoice Number',
 'Invoice Date','Actual Cost'
];
const DAY_NAMES = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MON_NAMES = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const _sessionMembers = {};
const _usedMemberIds = new Set();
function getMemberId(passengerName) {
 const key = String(passengerName).trim().toUpperCase();
 if (_sessionMembers[key]) return _sessionMembers[key];
 let id;
 do { id = 'FHCP' + String(Math.floor(Math.random() * 100000)).padStart(5, '0'); }
 while (_usedMemberIds.has(id));
 _usedMemberIds.add(id);
 _sessionMembers[key] = id;
 return id;
}
function updateMemberCount() {}
const usedTripIds = new Set();
function genTripId() {
 let id;
 do { id = 'FHCP' + String(Math.floor(Math.random() * 10000)).padStart(4, '0'); }
 while (usedTripIds.has(id));
 usedTripIds.add(id);
 return id;
}
function getCaliforniaTZ(dateStr) {
 if (!dateStr) return null;
 const d = new Date(dateStr + 'T12:00:00');
 const year = d.getUTCFullYear();
 const marchStart = new Date(Date.UTC(year, 2, 1));
 let marchSundays = 0, pdtStart;
 for (let day = 1; day <= 31; day++) {
 const dt = new Date(Date.UTC(year, 2, day));
 if (dt.getUTCDay() === 0) { marchSundays++; if (marchSundays === 2) { pdtStart = dt; break; } }
 }
 let pdtEnd;
 for (let day = 1; day <= 30; day++) {
 const dt = new Date(Date.UTC(year, 10, day));
 if (dt.getUTCDay() === 0) { pdtEnd = dt; break; }
 }
 const isPDT = d >= pdtStart && d < pdtEnd;
 return isPDT ? '-0700' : '-0800';
}
function updateTZ() {
 const dateStr = document.getElementById('tripDate').value;
 const tz = getCaliforniaTZ(dateStr);
 const tzDisplay = document.getElementById('tzDisplay');
 if (tz === '-0700') tzDisplay.textContent = '-0700 (PDT — Pacific Daylight Time)';
 else if (tz === '-0800') tzDisplay.textContent = '-0800 (PST — Pacific Standard Time)';
 else tzDisplay.textContent = 'Select a date above';
 checkReady();
}

// ---- Custom date picker (replaces native <input type="date">) ----
const CAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let calView = new Date();   // first-of-month currently shown
let calSelected = null;     // selected Date (local) or null
function _calPad(n) { return String(n).padStart(2, '0'); }
function calISO(d) { return d.getFullYear() + '-' + _calPad(d.getMonth() + 1) + '-' + _calPad(d.getDate()); }
function calDisplay(d) { return _calPad(d.getMonth() + 1) + '/' + _calPad(d.getDate()) + '/' + d.getFullYear(); }
function calSameDay(a, b) { return !!(a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate()); }
function setTripDate(d) {
  const hid = document.getElementById('tripDate'), txt = document.getElementById('dateText'), btn = document.getElementById('dateBtn');
  if (d) {
    calSelected = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    hid.value = calISO(calSelected); txt.textContent = calDisplay(calSelected); btn.classList.remove('empty');
  } else {
    calSelected = null; hid.value = ''; txt.textContent = 'Select a date'; btn.classList.add('empty');
  }
  updateTZ(); // keeps timezone display + checkReady() in sync
}
function renderCal() {
  const y = calView.getFullYear(), m = calView.getMonth(), today = new Date();
  document.getElementById('calTitle').textContent = CAL_MONTHS[m] + ' ' + y;
  const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
  const days = document.getElementById('calDays'); days.innerHTML = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cal-day'; b.textContent = d.getDate();
    if (d.getMonth() !== m) b.classList.add('muted');
    if (calSameDay(d, today)) b.classList.add('today');
    if (calSameDay(d, calSelected)) b.classList.add('selected');
    b.onclick = () => { setTripDate(d); closeCal(); };
    days.appendChild(b);
  }
}
function openCal() {
  calView = calSelected ? new Date(calSelected.getFullYear(), calSelected.getMonth(), 1) : new Date();
  renderCal();
  document.getElementById('calPop').classList.add('open');
}

function formatDateTime(dateStr, timeVal, tz) {
 const d = new Date(dateStr + 'T00:00:00');
 const dayName = DAY_NAMES[d.getUTCDay()];
 const dd = String(d.getUTCDate()).padStart(2, '0');
 const mon = MON_NAMES[d.getUTCMonth()];
 const yyyy = d.getUTCFullYear();
 let h = 0, m = 0;
 if (timeVal !== null && timeVal !== undefined && timeVal !== '') {
 const tv = timeVal;
 if (typeof tv === 'number' && tv >= 0 && tv < 1) {
 const totalMins = Math.round(tv * 24 * 60);
 h = Math.floor(totalMins / 60) % 24;
 m = totalMins % 60;
 } else {
 const ts = String(tv).trim().toUpperCase().replace(/\s+/g,'');
 const apMatch = ts.match(/^(\d{1,2}):(\d{2})(AM|PM)$/);
 if (apMatch) {
 h = parseInt(apMatch[1]); m = parseInt(apMatch[2]);
 if (apMatch[3]==='PM' && h!==12) h+=12;
 if (apMatch[3]==='AM' && h===12) h=0;
 } else {
 const parts = String(tv).trim().split(':');
 h = parseInt(parts[0]) || 0;
 m = parseInt(parts[1]) || 0;
 }
 }
 }
 const hh = String(h).padStart(2, '0');
 const mm = String(m).padStart(2, '0');
 return `${dayName}, ${dd} ${mon} ${yyyy} ${hh}:${mm}:00 ${tz}`;
}
function formatName(raw) {
 if (!raw) return '';
 let name = String(raw).replace(/\([^)]*\)/g, ' ').replace(/\u00a0/g, ' ').trim();
 if (name.includes(',')) {
  const parts = name.split(',');
  const last = parts[0].trim();
  const first = parts.slice(1).join(' ').trim();
  name = first ? first + ' ' + last : last;
 }
 return name.split(/\s+/).filter(Boolean).map(w => {
  if (w.length === 1) return w.toUpperCase();
  if (w.includes('-')) return w.split('-').map(p => p ? p.charAt(0).toUpperCase() + p.slice(1).toLowerCase() : '').join('-');
  return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
 }).join(' ');
}
function normalizeMobility(raw) {
 const s = String(raw).trim().toUpperCase();
 if (s.includes('STRETCHER') || s.includes('GURNEY')) return 'Stretcher';
 if (s.includes('W/C') || s === 'WC' || s.includes('WHEELCHAIR') || s.includes('W/C VAN') || s.includes('W/C TRANSPORT')) return 'Wheelchair';
 return 'Ambulatory'; 
}
function findCol(headers, ...keywords) {
 for (const kw of keywords) {
 const exact = headers.findIndex(h => h && String(h).trim().toLowerCase() === kw.toLowerCase());
 if (exact >= 0) return exact;
 const sub = headers.findIndex(h => h && String(h).toLowerCase().includes(kw.toLowerCase()));
 if (sub >= 0) return sub;
 }
 return -1;
}
const loadedFiles = [];

function handleFiles(fileList) {

function parseRows(rows) {
 let headerIdx = -1;
 for (let i = 0; i < Math.min(rows.length, 5); i++) {
 const r = rows[i];
 if (!r) continue;
 const vals = r.map(v => String(v || '').toLowerCase());
 if (vals.some(v => v.includes('client') || v.includes('pu time') || v.includes('pu address'))) {
 headerIdx = i; break;
 }
 }
 if (headerIdx < 0) return [];
 const headers = rows[headerIdx].map(h => String(h || '').trim());
 const dataRows = rows.slice(headerIdx + 1).filter(r => r && r.some(v => v !== null && v !== '' && v !== undefined));
 const iClient = findCol(headers, 'client');
 const iPhone = findCol(headers, 'client phone', 'phone');
 let iPuTime = findCol(headers, 'pu time');
 const iPuAddr = findCol(headers, 'pu address');
 const iDoAddr = findCol(headers, 'do address');
 const iDoZip = findCol(headers, 'do zip');
 const iMobility = findCol(headers, 'mode of transportation', 'mode');
 let iNotes = findCol(headers, 'notes');
 if (iNotes < 0) {
 for (let i = headers.length - 1; i >= 0; i--) {
 if (!headers[i] || headers[i].startsWith('Unnamed')) { iNotes = i; break; }
 }
 }
 // Fallback: some FHC exports (e.g. SOL SOUTH) omit the "PU Time" header
 // but include the data. Scan unassigned columns for time-like values.
 if (iPuTime < 0) {
  const claimed = new Set([iClient, iPhone, iPuAddr, iDoAddr, iDoZip, iMobility, iNotes].filter(x => x >= 0));
  const timeRe = /^\s*\d{1,2}:\d{2}(\s*[AP]M)?\s*$|^\s*\d{1,2}\s*[AP]M\s*$/i;
  const sample = dataRows.slice(0, Math.min(10, dataRows.length));
  let best = -1, bestHits = 0;
  for (let c = 0; c < headers.length; c++) {
   if (claimed.has(c)) continue;
   let hits = 0, total = 0;
   for (const r of sample) {
    const v = r ? r[c] : null;
    if (v == null || v === '') continue;
    total++;
    if (timeRe.test(String(v))) hits++;
   }
   if (total > 0 && hits / total >= 0.6 && hits > bestHits) { best = c; bestHits = hits; }
  }
  if (best >= 0) iPuTime = best;
 }
 const trips = [];
 for (const row of dataRows) {
 const client = iClient >= 0 ? row[iClient] : null;
 if (!client) continue; 
 const phone = iPhone >= 0 ? row[iPhone] : null;
 const puTime = iPuTime >= 0 ? row[iPuTime] : null;
 const puAddr = iPuAddr >= 0 ? row[iPuAddr] : null;
 let doAddr = iDoAddr >= 0 ? row[iDoAddr] : null;
 const doZip = iDoZip >= 0 ? row[iDoZip] : null;
 const mobility = iMobility >= 0 ? row[iMobility] : null;
 const notes = iNotes >= 0 ? row[iNotes] : null;
 if (doAddr && doZip) {
 const addrStr = String(doAddr).trim();
 const zipStr = String(parseInt(doZip) || doZip).trim();
 if (zipStr && !addrStr.includes(zipStr)) {

 }

}
