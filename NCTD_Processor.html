<script>
// Stage 2: Folder drag support
async function getAllFilesFromDrop(items) {
  const files = [];
  async function traverse(entry) {
    if (entry.isFile) {
      await new Promise(res => entry.file(f => { files.push(f); res(); }));
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const entries = await new Promise(res => reader.readEntries(res));
      for (const ent of entries) await traverse(ent);
    }
  }
  for (const item of items) {
    const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
    if (entry) await traverse(entry); else { const f = item.getAsFile(); if (f) files.push(f); }
  }
  return files;
}

if (typeof XLSX === 'undefined') {
  console.error('XLSX failed to load from vendor/xlsx.full.min.js');
}
const OUT_COLS = [
 'Trip ID','Vendor Trip ID','Trip Type','Passenger Member ID','Passenger',
 'Date Of Birth','Phone Number','Mobility','Extra','Estimated Pickup Time',
 'Earliest Departure Time','Latest Arrival Time','Appointment Time',
 'Buffer (minutes)','Pickup Address','Dropoff Address',
 'Estimated Distance (miles)','Third Party','Contract Name',
 'Contract Number','Status','Start Odometer','End Odometer',
 'Start Time','End Time','Comments','VA Notes','Loaded Mileage',
 'Wait Time (Minutes)','Unloaded Mileage','Invoice Number',
 'Invoice Date','Actual Cost'
];
const DAY_NAMES = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MON_NAMES = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const _usedTripIds = new Set();
const _sessionMembers = {};
const _usedMemberIds = new Set();
function genTripId() {
 let id;
 do { id = 'NCTD' + String(Math.floor(Math.random() * 10000)).padStart(4, '0'); }
 while (_usedTripIds.has(id));
 _usedTripIds.add(id);
 return id;
}
function getMemberId(name) {
 const key = String(name).trim().toUpperCase();
 if (_sessionMembers[key]) return _sessionMembers[key];
 let id;
 do { id = 'NCTD' + String(Math.floor(Math.random() * 100000)).padStart(5, '0'); }
 while (_usedMemberIds.has(id));
 _usedMemberIds.add(id);
 _sessionMembers[key] = id;
 return id;
}
function getCaliforniaTZ(dateStr) {
 const d = new Date(dateStr + 'T12:00:00');
 const year = d.getUTCFullYear();
 let marchSundays = 0, pdtStart;
 for (let day = 1; day <= 31; day++) {
 const dt = new Date(Date.UTC(year, 2, day));
 if (dt.getUTCDay() === 0) { marchSundays++; if (marchSundays === 2) { pdtStart = dt; break; } }
 }
 let pdtEnd;
 for (let day = 1; day <= 30; day++) {
 const dt = new Date(Date.UTC(year, 10, day));
 if (dt.getUTCDay() === 0) { pdtEnd = dt; break; }
 }
 return (d >= pdtStart && d < pdtEnd) ? '-0700' : '-0800';
}
function formatDateTime(dateStr, timeVal, tz) {
 const d = new Date(dateStr + 'T00:00:00');
 const dayName = DAY_NAMES[d.getUTCDay()];
 const dd = String(d.getUTCDate()).padStart(2, '0');
 const mon = MON_NAMES[d.getUTCMonth()];
 const yyyy = d.getUTCFullYear();
 let h = 0, m = 0;
 if (timeVal !== null && timeVal !== undefined && timeVal !== '') {
 const tv = timeVal;
 if (typeof tv === 'number' && tv > 0 && tv < 1) {
 const totalMins = Math.round(tv * 24 * 60);
 h = Math.floor(totalMins / 60) % 24;
 m = totalMins % 60;
 } else {
 const ts = String(tv).trim().toUpperCase().replace(/\s+/g, '');
 const apMatch = ts.match(/^(\d{1,2}):(\d{2})(AM|PM)?$/);
 if (apMatch) {
 h = parseInt(apMatch[1]); m = parseInt(apMatch[2]);
 if (apMatch[3] === 'PM' && h !== 12) h += 12;
 if (apMatch[3] === 'AM' && h === 12) h = 0;
 } else {
 const parts = String(tv).trim().split(':');
 h = parseInt(parts[0]) || 0;
 m = parseInt(parts[1]) || 0;
 }
 }
 }
 return `${dayName}, ${dd} ${mon} ${yyyy} ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00 ${tz}`;
}
function normalizeMobility(raw) {
 // Only an exact "AM" code is Ambulatory; every other value is Wheelchair.
 return String(raw == null ? '' : raw).trim().toUpperCase() === 'AM' ? 'Ambulatory' : 'Wheelchair';
}
function formatName(raw) {
 if (!raw) return '';
 const name = String(raw).replace(/\([^)]*\)/g, ' ').replace(/,/g, ' ').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
 return name.split(' ').map(part => {
 if (!part) return '';
 if (part.length === 1) return part.toUpperCase();
 if (part.includes('-')) return part.split('-').map(p => p ? p.charAt(0).toUpperCase() + p.slice(1).toLowerCase() : '').join('-');
 return part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
 }).join(' ');
}
function extractDateStr(val) {
 if (!val) return null;
 if (typeof val === 'number' && val > 40000 && val < 60000) {
 const d = new Date(Math.round((val - 25569) * 86400 * 1000));
 const y = d.getUTCFullYear();
 const mo = String(d.getUTCMonth() + 1).padStart(2, '0');
 const dd = String(d.getUTCDate()).padStart(2, '0');
 return `${y}-${mo}-${dd}`;
 }
 const s = String(val).trim();
 const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
 if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
 const us = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
 if (us) return `${us[3]}-${us[1].padStart(2,'0')}-${us[2].padStart(2,'0')}`;
 const usd = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
 if (usd) return `${usd[3]}-${usd[1].padStart(2,'0')}-${usd[2].padStart(2,'0')}`;
 return null;
}
function buildAddr(addr, city, zip) {
 const parts = [addr, city, zip].map(v => String(v || '').trim()).filter(v => v && v !== '0');
 return parts.join(' ');
}
function buildNotes(...parts) {
 return parts.map(v => {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return ''; // skip distances/numbers
  return String(v).trim();
 }).filter(v => v && v.trim() !== '' && v.trim() !== '0').join(' / ') || null;
}
function isDateVal(v) {
 if (!v) return false;
 if (typeof v === 'number' && v > 40000 && v < 60000) return true;
 const s = String(v).trim();
 if (s.match(/^\d{4}-\d{2}-\d{2}/)) return true;
 if (s.match(/^\d{1,2}\/\d{1,2}\/\d{4}/)) return true;
 return false;
}
function isTimeVal(v) {
 if (!v && v !== 0) return false;
 if (typeof v === 'number' && v > 0 && v < 1) return true;
 if (typeof v === 'string' && v.match(/^\d{1,2}:\d{2}/)) return true;
 return false;
}
function isNameStr(v) {
 return typeof v === 'string' && v.length > 3 && v.includes(',') && !v.includes(':');
}

function extractTimeFromNotes(notes) {
 if (!notes) return null;
 const text = String(notes);
 const rre = /(?<!\d)(\d{1,2}(?::\d{2})?(?:\s*[AP]M)?|\b\d{4}\b)\s*[-\u2013]\s*(?<!\d)(\d{1,2}(?::\d{2})?(?:\s*[AP]M)?|\b\d{4}\b)/gi;
 let m;
 while ((m = rre.exec(text)) !== null) {
  if (!/[AP]M|:/i.test(m[1]+m[2])) continue;
  const t = to24h(m[2]); if (t && t.h <= 23) return t;
 }
 const pp = text.match(/preferred\s+pick[\s-]*up\s+(?:time\s+)?(?:(?:at|of)\s+)?(\d{1,2}(?::\d{2})?\s*(?:AM|PM))/i);
 if (pp) { const t=to24h(pp[1]); if(t) return t; }
 const ret = text.match(/return\s+(?:pick[\s-]*up\s+(?:from\s+\w+\s+)?at\s+|(?:home\s+)?(?:at\s+)?)(\d{1,2}(?::\d{2})?\s*(?:AM|PM))/i);
 if (ret) { const t=to24h(ret[1]); if(t) return t; }
 const vr = text.match(/(?:request(?:ing)?\s+to\s+be\s+pick(?:ed)?[\s-]+up|veteran\s+request(?:ing)?(?:\s+to\s+be)?\s+pick(?:ed)?[\s-]+up)\s+(?:at\s+)?(\d{1,2}(?::\d{2})?\s*(?:AM|PM))/i);
 if (vr) { const t=to24h(vr[1]); if(t) return t; }
 const ct = text.match(/chair\s+time\s+(?:at\s+|@\s*)(\d{1,2}(?::\d{2})?\s*(?:AM|PM))/i);
 if (ct) { const t=to24h(ct[1]); if(t) return t; }
 // "(patient is) done with dialysis - 11:30AM" / "done at 0930" / "DONE TIME 0820"
 const done = text.match(/done\s+(?:with\s+[a-z]+\s*)?[-–:]?\s*(?:at\s+|@\s*|time\s+)?(\d{1,2}(?::\d{2})?\s*(?:AM|PM)|\b\d{4}\b)/i);
 if (done) { const t=to24h(done[1]); if(t) return t; }
 return null;
}

function getFingerprint(row, idx) {
 const passenger = idx['Passenger'] !== undefined ? row[idx['Passenger']] : null;
 const tripType  = idx['Trip Type']  !== undefined ? row[idx['Trip Type']]  : null;
 const appt      = idx['Appointment Time'] !== undefined ? row[idx['Appointment Time']] : null;
 const earliest  = idx['Earliest Departure Time'] !== undefined ? row[idx['Earliest Departure Time']] : null;

function parseHeaderRows(rows) {

const loadedFiles = [];
